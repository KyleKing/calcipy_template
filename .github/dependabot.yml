# Please see the documentation for all configuration options:
#   https://docs.github.com/en/code-security/dependabot/working-with-dependabot/keeping-your-actions-up-to-date-with-dependabot

# See Dependabot logs in: https://github.com/<owner>/<repo>/network/updates (under "Insights" tab)
#
# Actions pinned under package_template/**/*.jinja aren't covered here: they're wrapped in
# {% raw %} blocks Dependabot can't parse, and live only as a rendered mirror under .ctt/default
# that regenerates from the jinja source (reverting any bump made there). See
# .github/workflows/freshness-check.yml, which patches those pins directly.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      all-dependencies:
        update-types:
          - "major"
          - "minor"
          - "patch"
