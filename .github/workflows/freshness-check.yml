---
name: Freshness Check

# Checks pinned GitHub Action SHAs in package_template's jinja templates for drift. Dependabot
# can't see these: the real pins live wrapped in {% raw %} blocks, and Dependabot is only pointed
# at the rendered .ctt/default mirror, which gets regenerated from the jinja source anyway. On
# pull_request, runs in dry-run mode to validate configuration only, opening nothing.
#
# Requires the repo setting "Allow GitHub Actions to create and approve pull requests"
# (Settings > Actions > General).

"on":
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC
  pull_request:
    paths:
      - .github/workflows/freshness-check.yml
      - scripts/check_freshness.py
      - scripts/freshness/**
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check without opening a PR
        type: boolean
        default: false

concurrency:
  group: freshness-check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gha-pins:
    name: Check pinned GitHub Action versions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Compute freshness status
        id: compute
        env:
          APPLY_FLAG: ${{ (inputs.dry_run != true && github.event_name != 'pull_request') && '--apply' || '' }}
        run: |
          uv run python scripts/check_freshness.py $APPLY_FLAG --output /tmp/freshness.json
          delimiter="FRESHNESS_BODY_EOF_${RANDOM}_${RANDOM}"
          {
            echo "has_upgrades=$(jq '(.upgrades | length) > 0' /tmp/freshness.json)"
            echo "branch=$(jq -r .branch /tmp/freshness.json)"
            echo "title=$(jq -r .title /tmp/freshness.json)"
            echo "body<<$delimiter"
            jq -r .body /tmp/freshness.json
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Open or update PR
        # BRANCH_NAME (check_freshness.py) is a stable branch name, opened as a draft.
        # delete-branch cleans up a previously merged/closed branch the next time this action
        # runs (not immediately on merge/close); a later run with pending upgrades recreates it
        # from scratch, so there's never more than one open freshness PR.
        if: inputs.dry_run != true && github.event_name != 'pull_request' && steps.compute.outputs.has_upgrades == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: ${{ steps.compute.outputs.branch }}
          base: main
          delete-branch: true
          draft: true
          commit-message: ${{ steps.compute.outputs.title }}
          title: ${{ steps.compute.outputs.title }}
          body: ${{ steps.compute.outputs.body }}
